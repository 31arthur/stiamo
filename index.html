<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stiamo</title>
    <meta name="description" content="Stiamo — one calm canvas for legal cases and hearings, appointments and meetings, tasks, follow-ups, action plans and goals." />
    <meta name="application-name" content="Stiamo" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15141c" media="(prefers-color-scheme: dark)" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Installed as an app on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stiamo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stiamo" />
    <meta property="og:title" content="Stiamo — plan the day you meant to have" />
    <meta property="og:description" content="Cases and hearings, appointments and meetings, tasks, follow-ups, action plans and goals — across S&amp;B, FSA, media and life." />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stiamo" />
    <meta name="twitter:description" content="One calm canvas for cases, meetings, plans and goals." />
    <meta name="twitter:image" content="/icons/og-image.png" />
    <meta name="robots" content="noindex" />
    <style>
      /* Shown while the app starts, then replaced by it. The same three bars as the in-app loader. */
      .boot { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #fbfbfd; }
      .boot svg { width: 44px; height: 44px; }
      .boot rect { transform-box: fill-box; transform-origin: left center; animation: boot 1.15s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
      @keyframes boot { 0%, 100% { transform: scaleX(0.3); opacity: 0.45; } 50% { transform: scaleX(1); opacity: 1; } }
      @media (prefers-color-scheme: dark) { .boot { background: #15141c; } }
      @media (prefers-reduced-motion: reduce) { .boot rect { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>Stiamo needs JavaScript to run.</noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Stiamo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="3.6" rx="1.8" fill="#3d5bd0" />
          <rect x="3" y="10.2" width="18" height="3.6" rx="1.8" fill="#1b8f93" style="animation-delay: 0.16s" />
          <rect x="3" y="15.9" width="18" height="3.6" rx="1.8" fill="#e08a2d" style="animation-delay: 0.32s" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
