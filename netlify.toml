[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path is served by index.html so deep links (/plans/…, /cases/…) and
# reloads work. Real files (assets, icons) are served as they are.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so browsers may keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Only this app's own scripts run, and the page can talk only to the backend, Supabase and Google's viewers.
    # The AI providers are called by the backend, never the browser. A new backend address has to be added below.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://esm.sh; frame-src 'self' blob: https://drive.google.com https://docs.google.com https://view.officeapps.live.com; connect-src 'self' blob: https://stiamo-be.fullstackarthur.com https://*.supabase.co wss://*.supabase.co https://esm.sh; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
